name: Build and deploy VeloceDrop to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check project
        run: pnpm check
      - name: Lint project
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test:unit
      - name: Build static site
        run: pnpm build
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify deployable assets
        run: node scripts/verify-pages-output.mjs
        env:
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check landing JavaScript budget
        run: pnpm performance:landing
        env:
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
