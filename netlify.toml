[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify applies dist/_headers, which the postbuild step regenerates with the
# script hashes Astro emits. Do not declare Content-Security-Policy here: a
# second, hashless policy would be enforced alongside it and block the site's
# inline scripts.

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# English tool slugs were localized in a later release. Keep the old
# Indonesian-slug English URLs working with permanent redirects so any
# existing links and search results transfer their signals.
[[redirects]]
  from = "/en/kompres-foto-massal/*"
  to = "/en/batch-compress-images/"
  status = 301
  force = true

[[redirects]]
  from = "/en/ukuran/ubah-ukuran-gambar/*"
  to = "/en/resize-image/"
  status = 301
  force = true

[[redirects]]
  from = "/en/ukuran/resize-image/*"
  to = "/en/resize-image/"
  status = 301
  force = true

[[redirects]]
  from = "/en/konversi/gambar/*"
  to = "/en/convert-image/"
  status = 301
  force = true

[[redirects]]
  from = "/en/konversi/image/*"
  to = "/en/convert-image/"
  status = 301
  force = true

[[redirects]]
  from = "/en/hapus-latar/*"
  to = "/en/remove-background/"
  status = 301
  force = true

[[redirects]]
  from = "/en/watermark-logo-massal/*"
  to = "/en/watermark-logo/"
  status = 301
  force = true

[[redirects]]
  from = "/en/foto-ke-pdf/*"
  to = "/en/photos-to-pdf/"
  status = 301
  force = true

[[redirects]]
  from = "/en/pdf-ke-jpg/*"
  to = "/en/pdf-to-jpg/"
  status = 301
  force = true

[[redirects]]
  from = "/en/kompres-pdf/*"
  to = "/en/compress-pdf/500kb/"
  status = 301
  force = true

[[redirects]]
  from = "/en/cetak-foto/*"
  to = "/en/print-photo-sheet/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
